name: build

# Ejecutable de Windows. Cada push que toque v2 deja el .zip como artefacto
# del run; un tag vX.Y.Z además crea el release (privado, igual que el repo).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['zenithstars/**', 'packaging/**', 'tests/**', 'catalog_full.json', 'index.html',
            '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pywin32
      - run: python -m unittest discover -s tests -v
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZenithStars-windows
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "ZenithStars $GITHUB_REF_NAME" --generate-notes
      # Descarga sin cuenta para los PCs de clientes: el mismo zip va a un repo
      # público (solo binarios), también con nombre fijo para que
      # .../releases/latest/download/ZenithStars-windows-amd64.zip no cambie.
      # RELEASES_TOKEN: token fine-grained con Contents: read and write solo
      # sobre obstechspa/ZenithStars-releases (GITHUB_TOKEN no llega a otro repo).
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secret RELEASES_TOKEN: no se publicó en obstechspa/ZenithStars-releases"
            exit 0
          fi
          mkdir pub
          cp dist/ZenithStars-*-windows-amd64.zip pub/
          cp dist/ZenithStars-*-windows-amd64.zip pub/ZenithStars-windows-amd64.zip
          gh release create "$GITHUB_REF_NAME" pub/*.zip -R obstechspa/ZenithStars-releases \
            --title "ZenithStars $GITHUB_REF_NAME" \
            --notes "Descomprimir en una ruta corta (p. ej. C:\\ZenithStars) y ejecutar ZenithStars.exe. Instrucciones en LEEME.txt dentro del zip."
